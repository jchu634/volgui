[package]
name = "volgui"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["vendor/accesskit_windows"]
default-members = ["."]

[dependencies]
gpui-kit = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled", "hooks", "functions"] }
url = "2"
lz4_flex = "0.11"
memchr = "2"
regex = "1"

[features]
default = ["desktop"]
desktop = []
test-engine = []

[[bin]]
name = "volgui"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "volgui-test-engine"
path = "tests/support/engine.rs"
required-features = ["test-engine"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[patch.crates-io]
# Propagate destroyed-window errors from Windows accessibility callbacks.
accesskit_windows = { path = "vendor/accesskit_windows" }
